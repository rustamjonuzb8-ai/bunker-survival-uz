<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BUNKER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #2a2a2a 0%, #121212 60%, #0a0a0a 100%);
      color: #eee;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .box { width: 100%; max-width: 420px; margin: 0 auto; text-align: center; }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.4s; }
    .icon { font-size: 60px; animation: pulse 2s infinite; margin-top: 10px; }
    h1 {
      font-size: 42px;
      letter-spacing: 8px;
      color: #ffc400;
      text-shadow: 0 0 20px rgba(255, 196, 0, 0.4);
      margin: 8px 0 6px;
    }
    .sub { color: #999; margin-bottom: 20px; font-size: 15px; }
    .status {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      background: #222;
      border: 1px solid #444;
      margin-bottom: 22px;
    }
    .status.ok { color: #6dff8a; border-color: #2e7d3f; }
    .status.bad { color: #ff5252; border-color: #b71c1c; }
    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      background: #1b1b1b;
      border: 1px solid #444;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #ffc400; }
    input.code { letter-spacing: 6px; text-transform: uppercase; font-weight: 700; }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.yellow { background: #ffc400; color: #111; }
    .btn.red { background: #c62828; color: #fff; }
    .btn.gray { background: #2a2a2a; color: #ddd; border: 1px solid #444; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .or { color: #666; margin: 6px 0 12px; font-size: 14px; }
    .codebox {
      background: #1b1b1b;
      border: 2px dashed #ffc400;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .codebox small { color: #999; display: block; margin-bottom: 4px; }
    .codebox .big {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #ffc400;
    }
    .count { color: #aaa; margin-bottom: 10px; font-size: 14px; }
    .players { list-style: none; margin-bottom: 16px; }
    .players li {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: #1b1b1b;
      border: 1px solid #333;
      border-left: 4px solid #c62828;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      text-align: left;
      animation: slideIn 0.3s;
    }
    .players li.me { border-left-color: #ffc400; }
    .players li.off { opacity: 0.45; }
    .players .tag { font-size: 12px; color: #888; }
    .players .revs {
      width: 100%;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2c2c2c;
      font-size: 13px;
      color: #ccc;
    }
    .players .revs div { margin-bottom: 4px; }
    .players .revs b { color: #ffc400; font-weight: 600; }
    .hint { color: #888; font-size: 13px; margin-bottom: 12px; }

    /* O'YIN EKRANI */
    .disaster {
      background: linear-gradient(135deg, #3a0f0f, #1a1a1a);
      border: 1px solid #c62828;
      border-radius: 14px;
      padding: 16px;
      margin: 10px 0 12px;
      box-shadow: 0 0 25px rgba(198, 40, 40, 0.25);
    }
    .disaster .dtitle { font-size: 22px; font-weight: 800; color: #ff5252; margin-bottom: 8px; }
    .disaster p { font-size: 14px; color: #ddd; line-height: 1.5; }
    .bunkerinfo {
      background: #1b1b1b;
      border: 1px solid #ffc400;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 15px;
    }
    .bunkerinfo b { color: #ffc400; font-size: 18px; }
    .roundbar {
      background: #2a1d00;
      border: 1px solid #ffc400;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .roundbar .rtitle { font-size: 20px; font-weight: 800; color: #ffc400; }
    .roundbar .rsub { font-size: 14px; color: #ddd; margin-top: 4px; }
    .sec { font-size: 17px; color: #ffc400; margin: 14px 0 6px; text-align: left; }
    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-left: 4px solid #ffc400;
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 8px;
      text-align: left;
      opacity: 0;
      animation: cardIn 0.45s forwards;
    }
    .card.secret { border-left-color: #c62828; background: #221414; }
    .card.opened { border-left-color: #2e7d3f; }
    .card .clabel { font-size: 12px; color: #999; margin-bottom: 3px; }
    .card .cvalue { font-size: 16px; font-weight: 600; }
    .card .copened { font-size: 12px; color: #6dff8a; margin-top: 6px; }
    .openbtn {
      margin-top: 8px;
      padding: 8px 14px;
      background: #ffc400;
      color: #111;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .openbtn:active { transform: scale(0.96); }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%) translateY(100px);
      background: #c62828;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      max-width: 90%;
      transition: transform 0.3s;
      z-index: 10;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="box">

    <!-- BOSH EKRAN -->
    <div id="homeScreen" class="screen active">
      <div class="icon">☢️</div>
      <h1>BUNKER</h1>
      <p class="sub">Apokalipsisdan keyin kim omon qoladi?</p>
      <div id="status" class="status">Serverga ulanmoqda...</div>

      <input id="nameInput" type="text" maxlength="20" placeholder="Ismingiz" autocomplete="off">
      <button class="btn yellow" onclick="createRoom()">🚪 Xona yaratish</button>
      <div class="or">— yoki —</div>
      <input id="codeInput" class="code" type="text" maxlength="5" placeholder="XONA KODI" autocomplete="off">
      <button class="btn red" onclick="joinRoom()">🔑 Kod bilan kirish</button>
    </div>

    <!-- LOBBI EKRANI -->
    <div id="lobbyScreen" class="screen">
      <div class="icon">🚪</div>
      <h1 style="font-size:30px;letter-spacing:5px;">LOBBI</h1>
      <div id="status2" class="status">Serverga ulanmoqda...</div>

      <div class="codebox" id="codeBox">
        <small>Xona kodi (bosib nusxalang)</small>
        <div class="big" id="roomCode">-----</div>
      </div>

      <button class="btn gray" onclick="inviteFriends()">📨 Do'stlarni taklif qilish</button>

      <div class="count" id="countText"></div>
      <ul class="players" id="playersList"></ul>

      <button class="btn yellow" id="startBtn" onclick="startGame()" style="display:none;">▶️ O'yinni boshlash</button>
      <p class="hint" id="hintText"></p>
      <button class="btn gray" onclick="leaveRoom()">⬅️ Xonadan chiqish</button>
    </div>

    <!-- O'YIN EKRANI -->
    <div id="gameScreen" class="screen">
      <h1 style="font-size:32px;letter-spacing:6px;margin-top:10px;">BUNKER</h1>
      <div id="status3" class="status">Serverga ulanmoqda...</div>

      <div class="disaster">
        <div class="dtitle" id="dTitle"></div>
        <p id="dText"></p>
      </div>

      <div class="bunkerinfo">
        🛡️ Bunkerda faqat <b id="capText">0</b> ta joy bor.<br>
        Hozir <b id="totText">0</b> kishi bor.
      </div>

      <div class="roundbar">
        <div class="rtitle" id="roundTitle"></div>
        <div class="rsub" id="roundSub"></div>
      </div>

      <h2 class="sec">🪪 Sizning personajingiz</h2>
      <p class="hint" id="myHint" style="text-align:left;"></p>
      <div id="myCards"></div>

      <h2 class="sec">👥 O'yinchilar</h2>
      <ul class="players" id="gamePlayers"></ul>

      <button class="btn yellow" id="nextBtn" onclick="nextRound()" style="display:none;">➡️ Keyingi raund</button>
      <p class="hint" id="nextHint"></p>
      <button class="btn gray" id="backLobbyBtn" onclick="backToLobby()" style="display:none;">🔄 Lobbiga qaytish (test)</button>
      <button class="btn gray" onclick="leaveRoom()">⬅️ Xonadan chiqish</button>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // ---- Foydalanuvchi ----
    var myId = null;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      myId = "tg" + tg.initDataUnsafe.user.id;
    } else {
      try { myId = localStorage.getItem("bunkerId"); } catch (e) {}
      if (!myId) {
        myId = "u" + Math.random().toString(36).slice(2, 10);
        try { localStorage.setItem("bunkerId", myId); } catch (e) {}
      }
    }

    var nameInput = document.getElementById("nameInput");
    var savedName = "";
    try { savedName = localStorage.getItem("bunkerName") || ""; } catch (e) {}
    if (!savedName && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      savedName = tg.initDataUnsafe.user.first_name || "";
    }
    nameInput.value = savedName;

    // ---- Holat ----
    var ws = null;
    var currentCode = null;
    var myName = savedName;
    var SCREENS = ["homeScreen", "lobbyScreen", "gameScreen"];

    function showScreen(id) {
      SCREENS.forEach(function (s) {
        document.getElementById(s).classList.remove("active");
      });
      document.getElementById(id).classList.add("active");
    }

    function setStatus(ok, text) {
      ["status", "status2", "status3"].forEach(function (id) {
        var el = document.getElementById(id);
        el.textContent = text;
        el.className = "status " + (ok ? "ok" : "bad");
      });
    }

    var toastTimer = null;
    function toast(text) {
      var el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2800);
    }

    // ---- Server bilan aloqa ----
    function connect() {
      var proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(proto + "://" + location.host);

      ws.onopen = function () {
        setStatus(true, "🟢 Server bilan aloqa bor");
        if (currentCode) {
          send({ type: "join", id: myId, name: myName, code: currentCode });
        }
      };

      ws.onmessage = function (event) {
        var m;
        try { m = JSON.parse(event.data); } catch (e) { return; }

        if (m.type === "room") {
          currentCode = m.code;
          renderLobby(m);
          showScreen("lobbyScreen");
        }
        if (m.type === "game") {
          currentCode = m.code;
          renderGame(m);
          showScreen("gameScreen");
        }
        if (m.type === "error") {
          toast(m.text);
          if (m.fatal) {
            currentCode = null;
            showScreen("homeScreen");
          }
        }
        if (m.type === "left") {
          currentCode = null;
          showScreen("homeScreen");
        }
      };

      ws.onclose = function () {
        setStatus(false, "🔴 Aloqa uzildi, qayta ulanmoqda...");
        setTimeout(connect, 2000);
      };
      ws.onerror = function () {
        setStatus(false, "🔴 Serverga ulanib bo'lmadi");
      };
    }

    function send(obj) {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify(obj));
        return true;
      }
      toast("Server bilan aloqa yo'q. Biroz kuting...");
      return false;
    }

    function getName() {
      var name = nameInput.value.trim();
      if (!name) {
        toast("Avval ismingizni yozing");
        nameInput.focus();
        return null;
      }
      myName = name;
      try { localStorage.setItem("bunkerName", name); } catch (e) {}
      return name;
    }

    // ---- Tugmalar ----
    function createRoom() {
      var name = getName();
      if (!name) return;
      send({ type: "create", id: myId, name: name });
    }

    function joinRoom() {
      var name = getName();
      if (!name) return;
      var code = document.getElementById("codeInput").value.trim().toUpperCase();
      if (code.length !== 5) {
        toast("Xona kodi 5 ta belgidan iborat");
        return;
      }
      send({ type: "join", id: myId, name: name, code: code });
    }

    function leaveRoom() {
      send({ type: "leave" });
    }

    function startGame() {
      send({ type: "start" });
    }

    function backToLobby() {
      send({ type: "lobby" });
    }

    function nextRound() {
      send({ type: "nextround" });
    }

    function inviteFriends() {
      var text = "☢️ BUNKER o'yiniga qo'shil! Xona kodi: " + currentCode;
      var link = "https://t.me/Bunkeruz1_bot";
      var url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(text);
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, "_blank");
      }
    }

    document.getElementById("codeBox").onclick = function () {
      var c = currentCode;
      if (!c) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(c).then(
          function () { toast("Kod nusxalandi: " + c); },
          function () { toast("Kod: " + c); }
        );
      } else {
        toast("Kod: " + c);
      }
    };

    // ---- Lobbi chizish ----
    function renderLobby(m) {
      document.getElementById("roomCode").textContent = m.code;
      document.getElementById("countText").textContent =
        "O'yinchilar: " + m.players.length + " / " + m.max + " (kamida " + m.min + " kerak)";

      var list = document.getElementById("playersList");
      list.innerHTML = "";
      m.players.forEach(function (p) {
        var li = document.createElement("li");
        if (p.id === myId) li.className = "me";
        if (!p.online) li.className += " off";

        var left = document.createElement("span");
        left.textContent = (p.id === m.hostId ? "👑 " : "👤 ") + p.name;

        var right = document.createElement("span");
        right.className = "tag";
        right.textContent = (p.id === myId ? "siz" : "") + (p.online ? "" : " (uzilgan)");

        li.appendChild(left);
        li.appendChild(right);
        list.appendChild(li);
      });

      var startBtn = document.getElementById("startBtn");
      var hint = document.getElementById("hintText");
      var isHost = m.hostId === myId;
      if (isHost) {
        startBtn.style.display = "block";
        startBtn.disabled = m.players.length < m.min;
        hint.textContent = m.players.length < m.min
          ? "Boshlash uchun yana " + (m.min - m.players.length) + " ta o'yinchi kerak"
          : "Hammasi tayyor!";
      } else {
        startBtn.style.display = "none";
        hint.textContent = "Xona egasi o'yinni boshlashini kuting...";
      }
    }

    // ---- O'yin ekranini chizish ----
    function renderGame(m) {
      document.getElementById("dTitle").textContent = m.disaster.title;
      document.getElementById("dText").textContent = m.disaster.text;
      document.getElementById("capText").textContent = m.capacity;
      document.getElementById("totText").textContent = m.total;

      // Raund ma'lumoti
      var doneCount = m.players.filter(function (p) { return p.done; }).length;
      var allDone = doneCount === m.players.length;
      document.getElementById("roundTitle").textContent =
        "🔔 " + m.round + "-raund / " + m.maxRounds;
      document.getElementById("roundSub").textContent =
        "Kartasini ochganlar: " + doneCount + " / " + m.players.length;

      document.getElementById("myHint").textContent = m.mydone
        ? "✅ Bu raundda kartangizni ochdingiz. Boshqalarni kuting va bahslashing!"
        : "👆 Bu raundda bitta kartangizni tanlab, hammaga ochishingiz kerak.";

      // Mening kartalarim
      var cards = document.getElementById("myCards");
      cards.innerHTML = "";
      m.me.forEach(function (t, i) {
        var div = document.createElement("div");
        div.className = "card" + (t.key === "secret" ? " secret" : "") + (t.opened ? " opened" : "");
        div.style.animationDelay = (i * 0.08) + "s";

        var label = document.createElement("div");
        label.className = "clabel";
        label.textContent = t.label;

        var value = document.createElement("div");
        value.className = "cvalue";
        value.textContent = t.value;

        div.appendChild(label);
        div.appendChild(value);

        if (t.opened) {
          var o = document.createElement("div");
          o.className = "copened";
          o.textContent = "✅ Hammaga ochilgan";
          div.appendChild(o);
        } else if (!m.mydone) {
          var btn = document.createElement("button");
          btn.className = "openbtn";
          btn.textContent = "👁 Hammaga ochish";
          btn.onclick = function () { send({ type: "reveal", key: t.key }); };
          div.appendChild(btn);
        }
        cards.appendChild(div);
      });

      // O'yinchilar ro'yxati
      var list = document.getElementById("gamePlayers");
      list.innerHTML = "";
      m.players.forEach(function (p) {
        var li = document.createElement("li");
        if (p.id === myId) li.className = "me";
        if (!p.online) li.className += " off";

        var left = document.createElement("span");
        left.textContent = (p.id === m.hostId ? "👑 " : "👤 ") + p.name;

        var right = document.createElement("span");
        right.className = "tag";
        right.textContent = (p.done ? "✅" : "⏳") + (p.id === myId ? " · siz" : "");

        li.appendChild(left);
        li.appendChild(right);

        var keys = Object.keys(p.revealed || {});
        if (keys.length > 0) {
          var revs = document.createElement("div");
          revs.className = "revs";
          keys.forEach(function (k) {
            var row = document.createElement("div");
            var b = document.createElement("b");
            b.textContent = p.revealed[k].label + ": ";
            var v = document.createTextNode(p.revealed[k].value);
            row.appendChild(b);
            row.appendChild(v);
            revs.appendChild(row);
          });
          li.appendChild(revs);
        }
        list.appendChild(li);
      });

      // Xona egasi tugmalari
      var isHost = m.hostId === myId;
      var nextBtn = document.getElementById("nextBtn");
      var nextHint = document.getElementById("nextHint");
      if (isHost) {
        nextBtn.style.display = "block";
        nextBtn.disabled = !allDone;
        nextHint.textContent = allDone
          ? "Hamma kartasini ochdi. Keyingi raundga o'tishingiz mumkin."
          : "Hamma kartasini ochishini kuting...";
      } else {
        nextBtn.style.display = "none";
        nextHint.textContent = allDone
          ? "Xona egasi keyingi raundni boshlashini kuting..."
          : "";
      }
      document.getElementById("backLobbyBtn").style.display = isHost ? "block" : "none";
    }

    connect();
  </script>
</body>
</html>
